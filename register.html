<!DOCTYPE html>

<html lang="ru">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Регистрация | NFTopia Galaxy</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>

        body {

            background-color: #0f0e17;

            color: #fffffe;

            font-family: 'Inter', sans-serif;

        }

        .gradient-bg {

            background: linear-gradient(90deg, #7f5af0 0%, #2cb67d 100%);

        }

        .auth-card {

            background-color: #16161a;

            border-radius: 16px;

            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);

        }

        .input-field {

            background-color: #242629;

            border: 1px solid #2a2b32;

            color: #fffffe;

        }

        .input-field:focus {

            border-color: #7f5af0;

            box-shadow: 0 0 0 2px rgba(127, 90, 240, 0.2);

        }

    </style>

</head>

<body class="min-h-screen flex items-center justify-center p-4">

    <div class="auth-card w-full max-w-md p-8">

        <div class="text-center mb-8">

            <a href="index.html" class="flex items-center justify-center">

                <i class="fas fa-cubes text-3xl text-[#7f5af0] mr-2"></i>

                <span class="text-2xl font-bold">NFTopia Galaxy</span>

            </a>

            <h1 class="text-2xl font-bold mt-4">Создать аккаунт</h1>

            <p class="text-gray-400 mt-2">Начните свое NFT-путешествие</p>

        </div>



        <form id="register-form" class="space-y-6">

            <div>

                <label for="username" class="block text-sm font-medium mb-1">Имя пользователя</label>

                <input type="text" id="username" class="input-field w-full px-4 py-3 rounded-lg" placeholder="nftcollector" required>

            </div>



            <div>

                <label for="email" class="block text-sm font-medium mb-1">Электронная почта</label>

                <input type="email" id="email" class="input-field w-full px-4 py-3 rounded-lg" placeholder="your@email.com" required>

            </div>



            <div>

                <label for="password" class="block text-sm font-medium mb-1">Пароль</label>

                <input type="password" id="password" class="input-field w-full px-4 py-3 rounded-lg" placeholder="••••••••" required>

                <p class="text-xs text-gray-400 mt-1">Минимум 8 символов</p>

            </div>



            <div>

                <label for="confirm-password" class="block text-sm font-medium mb-1">Подтвердите пароль</label>

                <input type="password" id="confirm-password" class="input-field w-full px-4 py-3 rounded-lg" placeholder="••••••••" required>

            </div>



            <div class="flex items-start">

                <div class="flex items-center h-5">

                    <input id="terms" type="checkbox" class="w-4 h-4 rounded bg-[#242629] border-gray-600 focus:ring-[#7f5af0]" required>

                </div>

                <label for="terms" class="ml-2 text-sm text-gray-300">

                    Я согласен с <a href="#" class="text-[#7f5af0] hover:underline">Условиями использования</a> и <a href="#" class="text-[#7f5af0] hover:underline">Политикой конфиденциальности</a>

                </label>

            </div>



            <button type="submit" class="gradient-bg text-white w-full py-3 rounded-lg font-medium hover:opacity-90 transition-all">

                Зарегистрироваться

            </button>



            <div class="text-center text-sm text-gray-400">

                Уже есть аккаунт? <a href="login.html" class="text-[#7f5af0] hover:underline">Войти</a>

            </div>



            <div class="relative my-6">

                <div class="absolute inset-0 flex items-center">

                    <div class="w-full border-t border-gray-700"></div>

                </div>

                <div class="relative flex justify-center text-sm">

                    <span class="px-2 bg-[#16161a] text-gray-400">Или зарегистрироваться через</span>

                </div>

            </div>



            <div class="grid grid-cols-2 gap-4">

                <button type="button" class="bg-[#242629] text-white py-3 rounded-lg font-medium hover:bg-[#2a2b32] transition-all flex items-center justify-center">

                    <i class="fab fa-google text-[#DB4437] mr-2"></i> Google

                </button>

                <button type="button" class="bg-[#242629] text-white py-3 rounded-lg font-medium hover:bg-[#2a2b32] transition-all flex items-center justify-center">

                    <i class="fab fa-twitter text-[#1DA1F2] mr-2"></i> Twitter

                </button>

            </div>

        </form>

    </div>



    <script src="js/user-data.js"></script>

    <script src="js/notifications.js"></script>

    <script src="js/auth-ui.js"></script>

    <script>

        document.getElementById('register-form').addEventListener('submit', function(e) {

            e.preventDefault();

            

            const username = document.getElementById('username').value;

            const email = document.getElementById('email').value;

            const password = document.getElementById('password').value;

            const confirmPassword = document.getElementById('confirm-password').value;

            

            // Валидация

            if (password.length < 8) {

                showNotification('Пароль должен содержать минимум 8 символов', 'error');

                return;

            }

            

            if (password !== confirmPassword) {

                showNotification('Пароли не совпадают', 'error');

                return;

            }

            

            const result = userData.register({

                username: username,

                email: email,

                password: password

            });

            

            if (result.success) {

                showNotification('Регистрация успешна! Выполняется вход...', 'success');

                // Автоматический вход после регистрации

                setTimeout(() => {

                    const loginResult = loginUser(email, password);

                    if (loginResult.success) {

                        // Обновляем UI авторизации перед редиректом

                        if (typeof updateAuthUI !== 'undefined') {

                            updateAuthUI();

                        }

                        window.location.href = 'index.html';

                    }

                }, 1500);

            } else {

                showNotification(result.message, 'error');

            }

        });

    </script>



</body>

</html>
