<!DOCTYPE html>

<html lang="ru">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Статистика | NFTopia Galaxy</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link rel="stylesheet" href="style.css">

    <style>

        body {

            font-family: 'Inter', sans-serif;

            background-color: #0f0e17;

            color: #fffffe;

        }

        .gradient-bg {

            background: linear-gradient(90deg, #7f5af0 0%, #2cb67d 100%);

        }

    </style>

</head>

<body>

    <!-- Верхняя полоса -->

    <div class="gradient-bg text-white text-sm py-2 px-4">

        <div class="container mx-auto flex justify-between items-center">

            <div class="flex space-x-4">

                <a href="index.html" class="hover:underline">Главная</a>

                <a href="collections.html" class="hover:underline">Топ коллекции</a>

                <a href="auctions.html" class="hover:underline">Аукционы</a>

            </div>

            <div class="flex space-x-4">

                <a href="support.html" class="hover:underline">Поддержка</a>

                <a href="create-nft.html" class="hover:underline">Создать NFT</a>

            </div>

        </div>

    </div>

    

    <!-- Основное меню -->

    <header class="bg-[#16161a] shadow-sm sticky top-0 z-50">

        <div class="container mx-auto px-4 py-3">

            <div class="flex justify-between items-center">

                <a href="index.html" class="flex items-center">

                    <i class="fas fa-cubes text-2xl text-[#7f5af0] mr-2"></i>

                    <span class="text-xl font-bold">NFTopia Galaxy</span>

                </a>

                <nav class="hidden md:flex space-x-6">

                    <a href="marketplace.html" class="font-medium hover:text-[#7f5af0]">Маркетплейс</a>

                    <a href="statistics.html" class="font-medium text-[#7f5af0]">Статистика</a>

                    <a href="how-to-buy.html" class="font-medium hover:text-[#7f5af0]">Как купить</a>

                    <a href="blog.html" class="font-medium hover:text-[#7f5af0]">Блог</a>

                    <a href="profile.html" class="font-medium hover:text-[#7f5af0]">Профиль</a>

                </nav>

                <div class="flex items-center space-x-4">

                    <a href="cart.html" class="relative text-gray-300 hover:text-[#7f5af0]">

                        <i class="fas fa-shopping-cart text-xl"></i>

                        <span class="cart-badge absolute -top-2 -right-2 bg-[#7f5af0] text-white text-xs rounded-full w-5 h-5 flex items-center justify-center hidden">0</span>

                    </a>

                    <user-menu></user-menu>

                    <script src="components/user-menu.js"></script>

                </div>

            </div>

        </div>

    </header>

    

    <!-- Основной контент -->

    <main class="container mx-auto px-4 py-8">

        <h1 class="text-3xl font-bold mb-8">Статистика</h1>

        

        <!-- Табы -->

        <div class="flex space-x-4 mb-6 border-b border-gray-700">

            <button class="tab-button active px-4 py-2 font-medium border-b-2 border-[#7f5af0]" data-tab="rating">Рейтинг NFT</button>

            <button class="tab-button px-4 py-2 font-medium hover:text-[#7f5af0]" data-tab="authors">Топ авторы</button>

            <button class="tab-button px-4 py-2 font-medium hover:text-[#7f5af0]" data-tab="sales">История продаж</button>

        </div>

        

        <!-- Рейтинг NFT -->

        <div id="rating-tab" class="tab-content">

            <div class="bg-[#16161a] rounded-xl p-6 mb-6">

                <h2 class="text-xl font-bold mb-4">Топ NFT по объему продаж</h2>

                <div id="top-nfts" class="space-y-4">

                    <!-- Заполнится динамически -->

                </div>

            </div>

        </div>

        

        <!-- Топ авторы -->

        <div id="authors-tab" class="tab-content hidden">

            <div class="bg-[#16161a] rounded-xl p-6 mb-6">

                <h2 class="text-xl font-bold mb-4">Топ авторы</h2>

                <div id="top-authors" class="space-y-4">

                    <!-- Заполнится динамически -->

                </div>

            </div>

        </div>

        

        <!-- История продаж -->

        <div id="sales-tab" class="tab-content hidden">

            <div class="bg-[#16161a] rounded-xl p-6 mb-6">

                <h2 class="text-xl font-bold mb-4">История продаж</h2>

                <div id="sales-history" class="space-y-4">

                    <!-- Заполнится динамически -->

                </div>

            </div>

        </div>

    </main>

    

    <script src="js/nft-data.js"></script>

    <script src="js/user-data.js"></script>

    <script src="js/avatar-utils.js"></script>

    <script src="js/notifications.js"></script>

    <script src="js/auth-ui.js"></script>

    <script src="js/statistics.js"></script>

    <script>

        // Переключение табов

        document.querySelectorAll('.tab-button').forEach(button => {

            button.addEventListener('click', function() {

                document.querySelectorAll('.tab-button').forEach(btn => {

                    btn.classList.remove('active', 'border-b-2', 'border-[#7f5af0]');

                    btn.classList.add('hover:text-[#7f5af0]');

                });

                this.classList.add('active', 'border-b-2', 'border-[#7f5af0]');

                this.classList.remove('hover:text-[#7f5af0]');

                

                document.querySelectorAll('.tab-content').forEach(content => {

                    content.classList.add('hidden');

                });

                

                const tabId = this.dataset.tab + '-tab';

                document.getElementById(tabId).classList.remove('hidden');

            });

        });

    </script>

    <script src="components/user-menu.js"></script>

</body>

</html>
